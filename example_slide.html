# Welcome

This file (`example_slide.html`) is your presentation. To make your own talk:

- Open `example_slide.html` in a text editor
- Replace the text between the `textarea` tags
- Save, then reload the page in your browser

Slides are separated by a line of three dashes. A heading is a line starting with `#`.

No installation and no internet needed: it all works offline.

???
Notes can be added to any slide. This slide's notes are only visible in presenter view.

---

# Keyboard shortcuts

- **Left / Right arrows** (or Space): previous / next slide
- **C**: make a clone of the presentation in a new window (put it on the projector)
- **P**: presenter mode, with notes, a timer and the next slide
- **L**: turn the laser pointer on or off (it follows your mouse)
- **F**: full screen
- **H** or **?**: list of all shortcuts

???
Typical talk setup: press C, drag the clone window to the projector and make it full screen,
then press P in your own window. The laser pointer shows up in the clone too.

---

# Speaker notes

Notes are text only you can see, in presenter mode (press **P**).

- Put a line containing only `???` in a slide
- Everything below that line is a note, for that slide only

This slide has notes. Press **P** to see them.

???
These are the speaker notes for this slide.
- They can have several lines
- and bullets

---

# Images

image(images/example-plot.svg, 0.5)

`image(images/file.png)` shows a picture. Add a number to resize it, e.g. `image(images/file.png, 0.5)` for half the width.

---

# Equations

Use `$$ ... $$` for a displayed equation:

$$
\frac{\partial u}{\partial t} + u \frac{\partial u}{\partial x} = -\frac{1}{\rho}\frac{\partial p}{\partial x}
$$

Inline math works too: $E = mc^2$ and $x_1 + y_2$. Write them with single dollar signs.

---

# Grid of images, text and equations

.grid[2x2
image(images/example-plot.svg)
===
Any text works too:
- bullet one
- bullet two
===
$$ \kappa = \frac{1}{2}\frac{d\sigma^2}{dt} $$
===
image(images/example-plot-2.svg)
]

???
.grid[RxC ...] means R rows and C columns, filled row by row. Separate cells with a line containing only three equals signs.
A cell can be a picture, text, an equation or a mix. Two separator lines in a row leave a cell empty.

---

# Columns and lines

.grid[1x3
### First
- Some text
- and more text
|
===
### Second
Lines are optional. End a cell with a vertical bar for a line on its right
|
===
### Third
End with two underscores for a line below
__
]

---

# Videos

Videos work just like images:

- `video(videos/my_talk.mp4)` shows a video player
- `video(videos/my_talk.mp4, 0.5)` shows it at half the width

Put your video files in the `videos` folder. Videos also work inside grid cells.

---

# Before your talk

- Add `?check` to the address, e.g. `example_slide.html?check`, to find overflowing slides, broken images and math errors
- To make a PDF: print the page (Ctrl+P), choose *Save as PDF*, margins *None*, scale *100%*
- To share the talk, upload the whole folder to your website and send the link to `example_slide.html`
